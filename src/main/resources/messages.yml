prefix: "<!italic><gray>[</gray><gradient:#D8B4FE:#A855F7:#6D28D9><bold>📦</bold></gradient><gray>]</gray> "

no-permission: "{prefix}<red>У вас нет прав на это действие."
player-only: "{prefix}<red>Команда доступна только игрокам."
reload: "{prefix}<green>Конфигурация перезагружена."
reset: "{prefix}<green>Ротация миссий принудительно обновлена."

mission-complete: "{prefix}<white>Миссия выполнена: <gradient:#D8B4FE:#A855F7:#6D28D9><bold>{mission}</bold></gradient><white>.</white>"
mission-locked: "{prefix}<yellow>Сначала выполните предыдущую миссию. Следующая откроется после неё.</yellow>"
reward-given: "{prefix}<white>Вы получили <#B388FF>{amount}⟡</#B388FF> </white>"
reward-no-space: "{prefix}<red>Недостаточно места в инвентаре для награды! Освободите <white>{slots}</white> слот(а) и откройте <white>/missions</white><red>.</red>"
reward-pending-claim: "{prefix}<yellow>У вас есть невостребованная награда. Освободите место и нажмите на миссию в /missions."
bonus-given: "{prefix}<white>Бонус за все миссии: <#B388FF>+{amount}⟡</#B388FF><white>.</white>"
all-complete: "{prefix}<gradient:#EDE9FE:#C084FC:#7C3AED><bold>Все ежедневные миссии выполнены!</bold></gradient>"

exchange-success: "{prefix}<white>Обмен успешен! Потрачено <#B388FF>{cost}⟡</#B388FF><white>. Награда: <#B388FF>{reward}</#B388FF><white>.</white>"
exchange-not-enough: "{prefix}<red>Недостаточно шардов: <white>{have}</white><gray>/</gray><white>{cost}</white><red>.</red>"
exchange-cooldown: "{prefix}<red>Подождите перед следующим обменом."
exchange-stub: "{prefix}<#B388FF>⟡ <white>Обмен засчитан (режим заглушки). Подключите CoolContainers для выдачи ключей.</white>"
exchange-failed: "{prefix}<red>Не удалось выдать ключ через CoolContainers. Шарды возвращены.</red>"

admin-giveshard: "{prefix}<green>Выдано <white>{amount}</white> шард(ов) игроку <white>{player}</white>.</green>"
admin-setprogress: "{prefix}<green>Прогресс <white>{player}</white> по миссии <white>{mission}</white> установлен на <white>{value}</white>.</green>"
admin-player-not-found: "{prefix}<red>Игрок не найден.</red>"
admin-mission-not-found: "{prefix}<red>Миссия не найдена в текущей ротации.</red>"
