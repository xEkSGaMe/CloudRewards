timezone: "Europe/Moscow"
reset-time: "13:00" # HH:mm

gui:
  main:
    title: "<!italic><gradient:#C084FC:#7C3AED><bold>Миссии CloudWars</bold></gradient>"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    items:
      missions:
        slot: 11
        material: NETHER_STAR
        name: "<!italic><gray>[</gray><#C084FC>⟡<gray>]</gray> <gradient:#E9D5FF:#A855F7><bold>Миссии</bold></gradient>"
        lore:
          - "<!italic><gray>Ежедневные задания CloudWars</gray>"
          - ""
          - "<!italic><#C084FC>• <white>Обычных: <gray>2</gray></white>"
          - "<!italic><#C084FC>• <white>Сложная: <gray>1</gray></white>"
          - "<!italic><#C084FC>• <white>Обновление: <gray>{reset_time} МСК</gray></white>"
          - ""
          - "<!italic><yellow>▸ ЛКМ — открыть миссии</yellow>"
      help:
        slot: 13
        material: KNOWLEDGE_BOOK
        name: "<!italic><gray>[</gray><#7DD3FC>?<gray>]</gray> <gradient:#BAE6FD:#38BDF8><bold>Помощь</bold></gradient>"
        lore:
          - "<!italic><#7DD3FC>⟡ <white>Что такое миссии?</white>"
          - "<!italic><gray>Ежедневные задания, которые обновляются</gray>"
          - "<!italic><gray>каждый день в <white>{reset_time} по МСК</white><gray>.</gray>"
          - ""
          - "<!italic><#7DD3FC>⟡ <white>Награды</white>"
          - "<!italic><gray>• <white>За каждую миссию: <#C084FC>1 шард ⟡</#C084FC></white>"
          - "<!italic><gray>• <white>За все 3 миссии: <#C084FC>+2 шарда ⟡</#C084FC></white>"
          - ""
          - "<!italic><#7DD3FC>⟡ <white>Что такое шарды?</white>"
          - "<!italic><gray>Шарды — особая миссионная валюта.</gray>"
          - "<!italic><gray>Их можно обменять на ключи Сокровищницы.</gray>"
      exchange:
        slot: 15
        material: AMETHYST_CLUSTER
        name: "<!italic><gray>[</gray><#A855F7>⟡<gray>]</gray> <gradient:#E9D5FF:#A855F7:#7C3AED><bold>Обмен</bold></gradient>"
        lore:
          - "<!italic><#C084FC>⟡ <white>Ваши шарды: <gradient:#E9D5FF:#A855F7>{shards}</gradient></white>"
          - ""
          - "<!italic><gray>Курс: <#C084FC>20 ⟡</#C084FC> <gray>=</gray> <white>1 ключ Сокровищницы</white>"
          - "<!italic><gray>Шансы:</gray>"
          - "<!italic><gray> • <white>Малый ключ: <#C084FC>50%</#C084FC></white>"
          - "<!italic><gray> • <white>Средний ключ: <#C084FC>25%</#C084FC></white>"
          - "<!italic><gray> • <white>Большой ключ: <#C084FC>25%</#C084FC></white>"
          - ""
          - "<!italic><yellow>▸ ЛКМ — обменять 20 шардов</yellow>"

  missions:
    title: "<!italic><gradient:#C084FC:#7C3AED><bold>Ежедневные миссии</bold></gradient>"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    slots:
      normal-1: 12
      hard: 13
      normal-2: 14
      back: 22
      info: 4
    back-item:
      material: ARROW
      name: "<!italic><gray>▸ <white>Назад</white></gray>"
      lore:
        - "<!italic><dark_gray>Вернуться в главное меню</dark_gray>"
    info-item:
      material: CLOCK
      name: "<!italic><gray>[</gray><#C084FC>⟡<gray>]</gray> <gradient:#E9D5FF:#A855F7><bold>Информация</bold></gradient>"
      lore:
        - "<!italic><gray>Обновление: <white>{reset_time} МСК</white></gray>"
        - "<!italic><gray>До обновления: <white>{time_left}</white></gray>"
        - "<!italic><gray>Выполнено: <white>{completed}</white><gray>/</gray><white>3</white></gray>"
        - "<!italic><gray>Бонус за все 3: <#C084FC>+2 шарда ⟡</#C084FC></gray>"

rewards:
  shards-per-mission: 1
  all-complete-bonus: 2
  require-inventory-space: true

shard:
  material: PRISMARINE_CRYSTALS
  name: "<!italic><#B388FF><bold>⟡ Шард</bold>"
  custom-model-data: 0
  glint: true
  hide-flags: true
  pdc-key: "cloudrewards_shard"
  lore:
    - "<!italic><gray>Редкость: <#C084FC>Миссионный</#C084FC></gray>"
    - ""
    - "<!italic><#C084FC>▸ <white>Получение: <gray>за выполнение ежедневных миссий</gray></white>"
    - "<!italic><#C084FC>▸ <white>Обмен: <gray>20 шардов = 1 ключ Сокровищницы</gray></white>"
    - ""
    - "<!italic><dark_gray>Используется в /missions</dark_gray>"

exchange:
  cost: 20
  mode: COOLDOWNTAINERS # STUB | COOLDOWNTAINERS
  stub-refund-shards: true # в STUB не забирать шарды навсегда
  cooldown-seconds: 1
  chances:
    small: 50
    medium: 25
    large: 25
  # Реальные caseId из CoolContainers (/caseadmin или папка cases/).
  cases:
    small: "TREASURE_SMALL"
    medium: "TREASURE_MEDIUM"
    large: "TREASURE_LARGE"
  # sourcePlayer: INITIATOR | NONE
  source-player: INITIATOR

sounds:
  open: BLOCK_CHEST_OPEN
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  fail: BLOCK_NOTE_BLOCK_BASS
  exchange: BLOCK_AMETHYST_BLOCK_CHIME
