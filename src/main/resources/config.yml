timezone: "Europe/Moscow"
reset-time: "13:00" # HH:mm

gui:
  main:
    title: "<!italic><bold>&#7422EEМ&#7C20EEи&#841EEDс&#8B1BEDс&#9319ECи&#9B17ECи</bold>"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    items:
      missions:
        slot: 11
        material: NETHER_STAR
        name: "<!italic><gray>[</gray><#A855F7>⟡<gray>]</gray> <bold>&#7422EEМ&#7C20EEи&#841EEDс&#8B1BEDс&#9319ECи&#9B17ECи</bold>"
        lore:
          - "<!italic><gray>Ежедневные задания</gray>"
          - ""
          - "<!italic><#B388FF>• <white>Обычных: <gray>2</gray></white>"
          - "<!italic><#B388FF>• <white>Сложных: <gray>1</gray></white>"
          - "<!italic><#B388FF>• <white>Обновление: <gray>{reset_time} МСК</gray></white>"
          - ""
          - "<!italic><yellow>▸ ЛКМ — открыть миссии</yellow>"
      help:
        slot: 13
        material: KNOWLEDGE_BOOK
        name: "<!italic><gray>[</gray><#38BDF8>?<gray>]</gray> <bold>&#22BCEEП&#20BDEEо&#1EBEEDм&#1BBFEDо&#19C0ECщ&#17C1ECь</bold>"
        lore:
          - "<!italic><#7DD3FC>⟡ <white>Что такое миссии?</white>"
          - "<!italic><gray>Ежедневные задания, которые обновляются</gray>"
          - "<!italic><gray>каждый день в <white>{reset_time} по МСК</white><gray>.</gray>"
          - ""
          - "<!italic><#7DD3FC>⟡ <white>Награды</white>"
          - "<!italic><gray>• <white>За каждую миссию: <#B388FF>1 шард</#B388FF></white>"
          - "<!italic><gray>• <white>За все 3 миссии: <#B388FF>+2 шарда</#B388FF></white>"
          - ""
          - "<!italic><#7DD3FC>⟡ <white>Порядок миссий</white>"
          - "<!italic><gray><white>1.</white> Обычная <gray>→</gray> <white>2.</white> Сложная <gray>→</gray> <white>3.</white> Обычная</gray>"
          - "<!italic><gray>Миссии выполняются строго по порядку:</gray>"
          - "<!italic><gray>пока не выполнена текущая, следующая</gray>"
          - "<!italic><gray>скрыта и не засчитывается. Вместо неё</gray>"
          - "<!italic><gray>вы увидите неизвестную миссию без подсказок.</gray>"
          - ""
          - "<!italic><#7DD3FC>⟡ <white>Что такое шарды?</white>"
          - "<!italic><gray>Шарды — особая валюта.</gray>"
          - "<!italic><gray>Её можно обменять на ключи Сокровищницы.</gray>"
      exchange:
        slot: 15
        material: AMETHYST_CLUSTER
        name: "<!italic><gray>[</gray><#A855F7>⟡<gray>]</gray> <bold>&#F2C6DEОбмен</bold>"
        lore:
          - "<!italic><white>Ваши шарды: <#B388FF><bold>{shards} ⟡</bold></white>"
          - ""
          - "<!italic><gray>Курс: <#B388FF>20 ⟡</#B388FF> <gray>=</gray> <white>1 ключ Сокровищницы</white>"
          - "<!italic><gray>Шансы:</gray>"
          - "<!italic><gray> • <white>Малый ключ: <#B388FF>50%</#B388FF></white>"
          - "<!italic><gray> • <white>Средний ключ: <#B388FF>25%</#B388FF></white>"
          - "<!italic><gray> • <white>Большой ключ: <#B388FF>25%</#B388FF></white>"
          - ""
          - "<!italic><yellow>▸ ЛКМ — обменять 20 шардов</yellow>"

  missions:
    title: "<!italic><white>&#9515F1Е&#9615EFж&#9815ECе&#9914EAд&#9B14E8н&#9C14E5е&#9D14E3в&#9F14E0н&#A014DEы&#A113DCе &#A413D7м&#A613D5и&#A713D2с&#A812D0с&#AA12CDи&#AB12CBи"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    slots:
      normal-1: 12
      hard: 13
      normal-2: 14
      back: 22
      info: 4
    back-item:
      material: ARROW
      name: "<!italic><gray>▸ <white>Назад</white></gray>"
      lore:
        - "<!italic><dark_gray>Вернуться в главное меню</dark_gray>"
    info-item:
      material: CLOCK
      name: "<!italic><gray>[</gray><#A855F7>⟡<gray>]</gray> <gradient:#EDE9FE:#C084FC:#7C3AED><bold>Информация</bold></gradient>"
      lore:
        - "<!italic><gray>Обновление: <white>{reset_time} МСК</white></gray>"
        - "<!italic><gray>До обновления: <white>{time_left}</white></gray>"
        - "<!italic><gray>Выполнено: <white>{completed}</white><gray>/</gray><white>3</white></gray>"
        - "<!italic><gray>Бонус за все 3: <#B388FF>+2 шарда</#B388FF></gray>"
    locked-item:
      material: BARRIER
      name: "<!italic><gray>[</gray><#6B7280><bold>?</bold><gray>]</gray> <gray>Неизвестная миссия</gray>"
      lore:
        - "<!italic><dark_gray>???</dark_gray>"
        - ""
        - "<!italic><gray>Эта миссия пока скрыта.</gray>"
        - "<!italic><gray>Выполните предыдущую миссию,</gray>"
        - "<!italic><gray>чтобы увидеть задание.</gray>"

rewards:
  shards-per-mission: 1
  all-complete-bonus: 2
  require-inventory-space: true

shard:
  material: PRISMARINE_CRYSTALS
  name: "<!italic><#B388FF><bold>Шард</bold>"
  custom-model-data: 0
  glint: true
  hide-flags: true
  pdc-key: "cloudrewards_shard"
  lore:
    - ""
    - "<!italic><#B388FF>▸ <white>Получение: <gray>за выполнение ежедневных миссий</gray></white>"
    - "<!italic><#B388FF>▸ <white>Обмен: <gray>20 шардов = 1 ключ Сокровищницы</gray></white>"
    - ""
    - "<!italic><dark_gray>Используется в /missions</dark_gray>"

exchange:
  cost: 20
  mode: COOLDOWNTAINERS # STUB | COOLDOWNTAINERS
  stub-refund-shards: true # в STUB не забирать шарды навсегда
  cooldown-seconds: 1
  chances:
    small: 50
    medium: 25
    large: 25
  # Реальные caseId из CoolContainers (/caseadmin или папка cases/).
  cases:
    small: "TREASURE_SMALL"
    medium: "TREASURE_MEDIUM"
    large: "TREASURE_LARGE"
  # sourcePlayer: INITIATOR | NONE
  source-player: INITIATOR

sounds:
  open: BLOCK_CHEST_OPEN
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  fail: BLOCK_NOTE_BLOCK_BASS
  exchange: BLOCK_AMETHYST_BLOCK_CHIME
