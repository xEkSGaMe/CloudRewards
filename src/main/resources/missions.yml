pools:
  NORMAL:
    - id: break_diamond_ore_4
      name: "Добыть алмазную руду"
      description: "Сломайте 4 алмазной руды"
      material: DIAMOND_ORE
      type: BREAK_BLOCK
      target: { materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE] }
