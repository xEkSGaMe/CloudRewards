      material: RED_SANDSTONE
      type: CRAFT_COLLECTION
      target:
        materials: [RED_SANDSTONE, CHISELED_RED_SANDSTONE, CUT_RED_SANDSTONE, SMOOTH_RED_SANDSTONE]
      amount: 4

    - id: rename_sheep_jeb
      name: "Радужная овца"
      description: "Переименуйте овцу в jeb"
      material: NAME_TAG
      type: RENAME_ENTITY
      target: { entity: SHEEP, name: "jeb", ignore-case: true }
      amount: 1

  HARD:
    - id: craft_activator_rails
      name: "Инженер путей"
      description: "Скрафтите активирующие рельсы"
      material: ACTIVATOR_RAIL
      type: CRAFT_ITEM
      target: { materials: [ACTIVATOR_RAIL] }
      amount: 6

