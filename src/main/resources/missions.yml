      description: "Создайте все виды песчаника"
      material: SANDSTONE
      type: CRAFT_COLLECTION
      target:
        materials: [SANDSTONE, CHISELED_SANDSTONE, CUT_SANDSTONE, SMOOTH_SANDSTONE]
      amount: 4

    - id: craft_all_red_sandstone
      name: "Красный песчаник"
