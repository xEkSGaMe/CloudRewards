      name: "Незерский фермер"
      description: "Посадите нарост в песок душ"
      material: NETHER_WART
      type: PLANT_ON
      target: { place: NETHER_WART, on: SOUL_SAND }
      amount: 1

    - id: switch_town_chat_tc
      name: "Городской голос"
      description: "Перейдите в городской чат /tc"
      material: OAK_SIGN
      type: RUN_COMMAND
      target: { commands: ["/tc", "/townchat", "/towny:tc"] }
      amount: 1
      enabled: true # требует TownyChat/перехват команды; можно выключить

    - id: switch_global_chat_g
      name: "На весь мир"
      description: "Перейдите в глобальный чат /g"
      material: GOAT_HORN
      type: RUN_COMMAND
      target: { commands: ["/g", "/global", "/general"] }
      amount: 1
      enabled: true

    - id: play_30_min
      name: "Ветеран сессии"
      description: "Наиграйте 30 минут"
      material: CLOCK
      type: PLAY_TIME
      target: {}
      amount: 1800 # секунды

