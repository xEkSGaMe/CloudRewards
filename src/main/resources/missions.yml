    - id: boat_2km
      name: "Мореплаватель"
      description: "Пройдите на лодке 2 км"
      material: OAK_BOAT
      type: STAT_DELTA
      target: { statistic: BOAT_ONE_CM }
      amount: 200000

    - id: bone_meal_64
      name: "Садовник"
      description: "Используйте костную муку 64 раза"
      material: BONE_MEAL
      type: USE_BONE_MEAL
      target: {}
      amount: 64

    - id: drink_healing_2
      name: "Целитель"
